name: Docker release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize package path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Trigger deploy (when configured)
        if: ${{ env.DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
